# The dongle's web console and firmware moved to dinoyoshi/stadiacast-dongle
# (https://dinoyoshi.github.io/stadiacast-dongle/). This keeps the old address working: every
# page of this site sends the browser there, query string included (?demo).
name: Web console redirect (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/console-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
